<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <defs>
    <!-- Red Banner Gradient -->
    <linearGradient id="boldRedBanner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>

    <!-- Glowing Breaking Badge Gradient -->
    <linearGradient id="boldRedBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>

    <!-- 3D Newspaper Paper Gradient -->
    <linearGradient id="boldPaperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Fold / Back Shadow Gradient -->
    <linearGradient id="boldPaperFold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Gloss Top Highlight -->
    <linearGradient id="boldRedGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 1. Sombra suave de projeção na base -->
  <ellipse cx="12" cy="22" rx="8.5" ry="1.4" fill="#000000" opacity="0.4"/>

  <!-- 2. Camada traseira / Dobra do jornal (3D fold) -->
  <path d="M4 6C4 4.5 5 3.5 6.5 3.5H16.5C17.5 3.5 18 4 18 5V18.5C18 19.5 17 20 16 20H5.5C4.5 20 4 19.2 4 18.2V6Z"
        fill="url(#boldPaperFold)"/>

  <!-- 3. Corpo principal do jornal (Folha branca 3D) -->
  <rect x="3.5" y="4.5" width="16" height="15.8" rx="2.2"
        fill="url(#boldPaperGrad)" stroke="#CBD5E1" stroke-width="0.5"/>

  <!-- 4. Barra Superior Vermelha ("NEWS" Header) -->
  <rect x="3.5" y="4.5" width="16" height="5.2" rx="2"
        fill="url(#boldRedBanner)"/>
  <!-- Brilho na barra vermelha -->
  <path d="M3.5 6.5C3.5 5.4 4.4 4.5 5.5 4.5H17.5C18.6 4.5 19.5 5.4 19.5 6.5V7H3.5V6.5Z"
        fill="url(#boldRedGloss)"/>

  <!-- 5. Título "NEWS" em negrito marcante -->
  <text x="10.2" y="8.5"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif"
        font-size="3.8"
        font-weight="900"
        letter-spacing="0.3"
        fill="#FFFFFF"
        text-anchor="middle">NEWS</text>

  <!-- 6. Selo / Badge circular de "BREAKING" com raio (Canto Superior Direito) -->
  <circle cx="18.8" cy="5.8" r="3.4" fill="#7F1D1D" opacity="0.3"/>
  <circle cx="18.8" cy="5.8" r="2.8" fill="url(#boldRedBadge)" stroke="#FFFFFF" stroke-width="0.5"/>
  <!-- Ícone de raio no selo -->
  <path d="M19 4L17.8 5.8H19L18.4 7.6L20 5.4H18.8L19 4Z" fill="#FFFFFF"/>

  <!-- 7. Barras grossas de manchete (Preto marcante para leitura à distância) -->
  <rect x="5.2" y="11.2" width="12.6" height="1.8" rx="0.6" fill="#0F172A"/>
  <rect x="5.2" y="13.8" width="12.6" height="1.8" rx="0.6" fill="#1E293B"/>

  <!-- 8. Colunas de notícias inferiores (Espessura grossa e alta definição) -->
  <rect x="5.2" y="16.5" width="5.8" height="1.5" rx="0.5" fill="#334155"/>
  <rect x="5.2" y="18.5" width="4.5" height="1.2" rx="0.4" fill="#64748B"/>

  <rect x="12" y="16.5" width="5.8" height="1.5" rx="0.5" fill="#334155"/>
  <rect x="12" y="18.5" width="4.8" height="1.2" rx="0.4" fill="#64748B"/>
</svg>
